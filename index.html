<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>お席へご案内します ―廃墟階―</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <div id="locker" class="hide"><div class="slits"></div></div>
  <div id="veil"></div>
  <div id="msg"></div>
  <div id="floorTag" class="hide"></div>
  <div id="hud" class="hide">
    <div id="hudObj"></div>
    <div id="hudCode"></div>
    <div class="stam"><span>STAMINA</span><div class="bar"><i id="stamBar"></i></div></div>
    <div id="hudSub"></div>
  </div>
  <div id="sub"><span id="subWho" class="who"></span><span id="subText"></span></div>
  <div id="prompt"></div>
  <div id="note"></div>
  <div id="chapter"><div id="chapNo"></div><div id="chapTitle"></div></div>
  <div id="face"><div>(o ω o)</div></div>
  <canvas id="radar" class="hide" width="220" height="220"></canvas>
  <div id="mon" class="hide"><div class="rec">● REC</div><div id="monName"></div><div id="monTime"></div><div class="help">A / D：カメラ切替　E：戻る</div></div>
  <div id="doc" class="hide"><div id="docTtl"></div><div id="docBody"></div><div class="help">E で閉じる</div></div>
  <div id="cross" class="hide"></div>
  <canvas id="map" class="hide"></canvas>
  <div id="memo" class="hide"><div id="memoTtl"></div><div id="memoCode"></div><div class="note">※忘れるな</div></div>
  <div id="codeUI" class="hide">
    <div id="codeBox">
      <div class="t"></div>
      <div id="codeDisp"></div>
      <div id="codePad"></div>
      <div id="codeErr"></div>
    </div>
  </div>
  <div id="ov">
    <div class="panel">
      <div class="face">(o ω o)</div>
      <h1 id="ovTitle"></h1>
      <div id="ovBody"></div>
      <div id="ovBtns"></div>
      <div id="settings">
        <label>マウス感度 <input id="sens" type="range" min="0.3" max="2.5" step="0.05"></label>
        <label>音量 <input id="vol" type="range" min="0" max="1" step="0.05"></label>
        <label>画質 <select id="quality"><option value="high">高</option><option value="low">低（軽量）</option></select></label>
      </div>
    </div>
  </div>
  <div id="loading">読み込み中…</div>
</div>
<noscript>JavaScript を有効にしてください。</noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
